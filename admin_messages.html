{% extends "admin_base.html" %}
{% block title %}Messages{% endblock %}
{% block content %}
<h1 style="color:#fff;">Contact messages</h1>
{% if not messages %}
<p style="color:var(--dim);">No messages yet.</p>
{% endif %}
{% for m in messages %}
<div class="card">
  <div style="display:flex; justify-content:space-between;">
    <strong>{{ m.name }} &lt;{{ m.email }}&gt;</strong>
    <span style="color:var(--dim); font-size:12px;">{{ m.created_at }}</span>
  </div>
  <p style="color:var(--text); margin:10px 0;">{{ m.message }}</p>
  <form class="del-form" method="POST" action="{{ url_for('admin_delete_message', msg_id=m.id) }}" onsubmit="return confirm('Delete this message?');">
    <button class="danger" type="submit">delete</button>
  </form>
</div>
{% endfor %}
{% endblock %}
