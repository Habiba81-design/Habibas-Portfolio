<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Admin — {% block title %}Dashboard{% endblock %}</title>
<style>
  :root{ --bg:#0A0E14; --panel:#0F1520; --border:rgba(148,163,184,0.14); --text:#DCE3EC; --dim:#7C8797; --accent:#3ECF8E; --red:#FF6B6B; --amber:#FFB86B; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13.5px; }
  a{ color:var(--accent); text-decoration:none; } a:hover{ text-decoration:underline; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 24px; border-bottom:1px solid var(--border); background:var(--panel); }
  .topbar .brand{ font-weight:700; color:#fff; }
  .topbar nav a{ margin-right:16px; color:var(--dim); }
  .topbar nav a.active, .topbar nav a:hover{ color:var(--accent); }
  .wrap{ max-width:900px; margin:0 auto; padding:32px 24px; }
  .flash{ background:rgba(62,207,142,0.1); border:1px solid rgba(62,207,142,0.3); color:var(--accent); padding:10px 14px; border-radius:8px; margin-bottom:18px; }
  table{ width:100%; border-collapse:collapse; margin-bottom:24px; }
  th, td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  th{ color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:20px; }
  .card h3{ margin:0 0 14px; font-size:14px; color:#fff; }
  input, textarea, select{ width:100%; padding:9px 11px; margin-bottom:10px; background:#131B29; border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:inherit; font-size:13px; }
  label{ display:block; color:var(--dim); font-size:11.5px; margin-bottom:4px; }
  button{ padding:9px 16px; background:var(--accent); border:none; border-radius:6px; color:#04140C; font-weight:700; cursor:pointer; font-family:inherit; font-size:13px; }
  button.danger{ background:var(--red); }
  .row{ display:flex; gap:12px; }
  .row > *{ flex:1; }
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .stat{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .stat .num{ font-size:24px; font-weight:700; color:var(--accent); }
  .stat .label{ color:var(--dim); font-size:11.5px; margin-top:4px; }
  .del-form{ display:inline; }
</style></head>
<body>
<div class="topbar">
  <span class="brand">$ admin</span>
  <nav>
    <a href="{{ url_for('admin_dashboard') }}">dashboard</a>
    <a href="{{ url_for('admin_projects') }}">projects</a>
    <a href="{{ url_for('admin_skills') }}">skills</a>
    <a href="{{ url_for('admin_experience') }}">experience</a>
    <a href="{{ url_for('admin_achievements') }}">achievements</a>
    <a href="{{ url_for('admin_messages') }}">messages</a>
    <a href="{{ url_for('admin_analytics') }}">analytics</a>
    <a href="{{ url_for('admin_logout') }}" style="color:var(--red);">logout</a>
  </nav>
</div>
<div class="wrap">
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body></html>
